<!DOCTYPE html>
<html>
    <head>
        <!--linking the external files to the Html-->
        <link rel="stylesheet" href="/Puzzle-Game-V1/Difficulty/difficulty.css">
        <link rel="stylesheet" href="/Puzzle-Game-V1/nav.css">
        
        

        <!--title of the Page-->
        <title>ReGuess - Puzzle Game</title>
        <link rel="icon" type="image/jpg" href="/Puzzle-Game-V1/img/reguess-logo.jpg"/>

        <!--Navigation Bar div-->

            <img src="/Puzzle-Game-V1/img/reguess-logo.jpg" alt="ReGuess Logo">

    <body>
        <div class="levelChoice">
            <p> Choose a level <br>
            Keep in mind the game does not change. <br>
            The words only get more difficult to guess <br>
            Good Luck!
            </p>
            <button type="button" id="easyLevel" onclick="difficulty('easy')">Level 1</button>
            <button type="button" id="mediumLevel" disabled="True" onclick="difficulty('medium')">Level 2</button>
            <button type="button" id="hardLevel" disabled="True" onclick="difficulty('hard')">Level 3</button>
            <button id="downloadStats"  disabled="True" href="#">See Stats</button>

            <button id="floatingButton" onclick="resetGame()">Reset</button>
        </div>
        
    </body>
    <script src="/Puzzle-Game-V1/Game/level.js"></script>
    <script src="/Puzzle-Game-V1/Difficulty/difficultyManager.js"></script>
